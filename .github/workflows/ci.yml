name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++

      - name: Configure
        run: cmake --preset linux-gcc

      - name: Build
        run: cmake --build --preset linux-gcc

      - name: Test
        run: ctest --preset linux-gcc --output-on-failure

  windows-mingw:
    name: Windows (MinGW-w64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: cmake --preset win-mingw

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset win-mingw

      - name: Test
        shell: msys2 {0}
        run: ctest --preset win-mingw --output-on-failure

  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Configure
        run: cmake --preset win-msvc

      - name: Build
        run: cmake --build --preset win-msvc

      - name: Test
        run: ctest --preset win-msvc --output-on-failure
