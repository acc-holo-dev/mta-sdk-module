name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (GCC) — build + unit + lua + CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++

      # The module compiles against other/third_party/mta-sdk/lua, the
      # server-side Lua ABI against other/third_party/lua/src. They must never
      # drift (lua_newstate/luaL_newstate carry the server's extra mtasaowner
      # argument).
      - name: Verify Lua headers match the compiled Lua
        run: |
          for h in lua.h luaconf.h lauxlib.h lualib.h; do
            cmp -s "other/third_party/mta-sdk/lua/$h" "other/third_party/lua/src/$h" \
              || { echo "ERROR: other/third_party/mta-sdk/lua/$h differs from other/third_party/lua/src/$h"; exit 1; }
          done
          echo "Lua headers: OK"

      - name: Configure
        run: cmake --preset linux-gcc

      - name: Build
        run: cmake --build --preset linux-gcc

      - name: Test (unit + lua)
        run: ctest --preset linux-gcc --output-on-failure

      # Exercise the `mta` CLI on a real built module: the doc generator
      # (registry metadata, no Lua VM) and the separated test filters.
      - name: CLI smoke (docs, test unit, test lua)
        run: |
          python other/tools/mta/cli.py docs
          python other/tools/mta/cli.py test unit
          python other/tools/mta/cli.py test lua

  linux-clang:
    name: Linux (Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++ clang

      - name: Configure
        run: >
          cmake -B build/linux-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build/linux-clang

      - name: Test
        run: ctest --test-dir build/linux-clang --output-on-failure

  windows-mingw:
    name: Windows (MinGW-w64) — build + unit + lua
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: cmake --preset win-mingw

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset win-mingw

      - name: Test
        shell: msys2 {0}
        run: ctest --preset win-mingw --output-on-failure

  windows-msvc:
    name: Windows (MSVC) — build + unit + lua
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Configure
        run: cmake --preset win-msvc

      - name: Build
        run: cmake --build --preset win-msvc

      - name: Test
        run: ctest --preset win-msvc --output-on-failure

  doctor:
    name: mta doctor (environment readiness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain probes
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++

      - name: Run doctor
        run: python other/tools/mta/cli.py doctor

  cppcheck:
    # Static analysis gate (warning/portability findings fail CI).
    # Suppressions are codebase-specific, documented in the gate:
    # - nullPointer: cppcheck mis-models the assert(lua_vm) guards
    #   (bogus "(int*)NULL" reports on the assert lines).
    # - uninitMemberVar / uninitMemberVarNoCtor: conservative on the
    #   registration-only structs (Spec, ObjectTypeInfo) — constructed
    #   only in registration paths that set every member.
    # Registration macros are expanded to nothing (cppcheck cannot parse
    # them) and the module identity defines satisfy the #error guards.
    # Performance findings are informational: gate on them locally with
    # --enable=performance, not in CI.
    name: cppcheck (static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Static analysis gate
        run: >
          cppcheck --std=c++20 --enable=warning,portability
          --suppress=nullPointer
          --suppress=uninitMemberVar
          --suppress=uninitMemberVarNoCtor
          -DMTA_OBJECT= -DMTA_METHOD= -DMTA_STATE= -DMTA_LUA_FUNCTION= -DMTA_LUA_FUNC= -DMTA_FUNCTION= -DSDK_MODULE_VERSION=1 -DSDK_MODULE_TITLE=base -DSDK_MODULE_AUTHOR=Developer
          --error-exitcode=1
          -I source -I other/third_party/lua/src -I other/third_party/mta-sdk
          --quiet source

  integration:
    # Run the real-server integration where the environment
    # allows. The harness drives a pinned Windows MTA server build
    # (mtasa-24140, other/server/ — platform "windows", MTA Server64.exe),
    # so this job runs on a Windows runner with the MinGW toolchain and the
    # harness builds the module through the default (win-mingw) preset.
    # This is a blocking test step: a failure here fails CI (Task 22 lists
    # integration among the mandatory steps).
    name: Real-server integration
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      # The CLI/harness run through the runner's native Python (the MSYS2
      # environment has no Python); the MinGW toolchain the build needs comes
      # from the UCRT64 environment and is put on PATH -- the same layout the
      # release workflow uses.
      - name: Put the MinGW toolchain on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\msys64\ucrt64\bin'

      - name: Build the module
        shell: pwsh
        run: python other/tools/mta/cli.py build --preset win-mingw

      - name: Install the pinned server and run the integration
        shell: pwsh
        run: |
          python other/tools/mta/cli.py server install
          python other/tools/mta/cli.py test integration

  integration-linux:
    # Real-server integration on the Linux server build (multitheftauto_linux_*
    # tarball, other/server/ -- platform "linux", mta-server64). The Linux
    # server is headless: the harness drives it through a stdin/stdout pipe
    # instead of a Win32 console. Blocking: a failure here fails CI.
    name: Real-server integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++

      - name: Build the module
        run: python other/tools/mta/cli.py build --preset linux-gcc

      - name: Install the pinned server and run the integration
        run: |
          python other/tools/mta/cli.py server install
          python other/tools/mta/cli.py test integration