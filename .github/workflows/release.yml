name: Release

# Attaches ready-to-use module binaries to a GitHub Release whenever a
# version tag (v*) is pushed (plan PHASE 14). Release artifacts are exactly
# the module binaries — <module-name>.dll / <module-name>.so — nothing else
# ships (plan §36). Every target builds, passes the test suites, packages
# via `mta package` (dist/<name>-<version>-<platform> + sha256) and
# publishes.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc
            runs-on: ubuntu-latest
          - preset: win-mingw
            runs-on: windows-latest
          - preset: win-msvc
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++

      - name: Set up MSYS2 toolchain (Windows MinGW)
        if: matrix.preset == 'win-mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Set up MSVC (Windows)
        if: matrix.preset == 'win-msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows MSVC)
        if: matrix.preset == 'win-msvc'
        run: choco install ninja -y --no-progress

      # The CLI is driven with the runner's native Python; the MinGW
      # toolchain is picked up from C:\msys64\ucrt64\bin via PATH (the same
      # layout the SDK expects locally under build/toolchain or PATH).
      - name: Put the MinGW toolchain on PATH
        if: matrix.preset == 'win-mingw'
        shell: pwsh
        run: "Add-Content $env:GITHUB_PATH 'C:\\msys64\\ucrt64\\bin'"

      - name: Build
        run: python other/tools/mta/cli.py build ${{ matrix.preset }}

      - name: Test (unit + lua)
        run: python other/tools/mta/cli.py test ${{ matrix.preset }} all

      # Plan PHASE 14 pipeline lists integration before packaging. The real
      # server run depends on an external download and runner console
      # quirks, so on release it is a non-blocking canary (CI runs it the
      # same way); the blocking gates are build + tests.
      - name: Integration canary (non-blocking)
        if: matrix.preset == 'win-mingw'
        continue-on-error: true
        run: |
          python other/tools/mta/cli.py server install
          python other/tools/mta/cli.py server test

      - name: Package (binaries only)
        run: python other/tools/mta/cli.py package ${{ matrix.preset }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true