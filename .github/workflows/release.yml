name: Release

# Attaches ready-to-use module binaries to a GitHub Release whenever a
# version tag (v*) is pushed. Release artifacts are exactly
# the module binaries — <module-name>.dll / <module-name>.so — nothing else
# ships. Every target builds, passes the test suites, runs the
# integration harness where the pinned-server environment allows, packages
# via `mta package --release-name` (dist/<module>.dll/.so + sha256) and
# publishes. Publish is a sequential step: it runs only when every prior
# step of the job succeeded.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc
            runs-on: ubuntu-latest
          - preset: win-mingw
            runs-on: windows-latest
          - preset: win-msvc
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++

      - name: Set up MSYS2 toolchain (Windows MinGW)
        if: matrix.preset == 'win-mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Set up MSVC (Windows)
        if: matrix.preset == 'win-msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows MSVC)
        if: matrix.preset == 'win-msvc'
        run: choco install ninja -y --no-progress

      # The CLI is driven with the runner's native Python; the MinGW
      # toolchain is picked up from C:\msys64\ucrt64\bin via PATH (the same
      # layout the SDK expects locally under build/toolchain or PATH).
      - name: Put the MinGW toolchain on PATH
        if: matrix.preset == 'win-mingw'
        shell: pwsh
        run: "Add-Content $env:GITHUB_PATH 'C:\\msys64\\ucrt64\\bin'"

      - name: Build
        run: python other/tools/mta/cli.py build --preset ${{ matrix.preset }}

      - name: Test (unit + lua)
        run: python other/tools/mta/cli.py test --preset ${{ matrix.preset }} all

      # The pipeline runs integration before packaging. The pinned
      # MTA server build is Windows-only (other/server/: platform "windows",
      # MTA Server64.exe, msiexec-provisioned 7-Zip), so the harness can run
      # on the MinGW target — the environment's "relevant integration
      # tests" allows (it builds the module via the default win-mingw preset).
      # The step is blocking: a failure here stops packaging and publishing.
      - name: Integration (real server, blocking)
        if: matrix.preset == 'win-mingw'
        run: |
          python other/tools/mta/cli.py server install
          python other/tools/mta/cli.py test integration

      - name: Package (binaries only)
        run: python other/tools/mta/cli.py package --preset ${{ matrix.preset }} --release-name

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # The release body comes from the v* tag annotation. Do not use
          # generate_release_notes here: this step runs per matrix leg and
          # regenerated PR notes would be appended per leg.
          generate_release_notes: false